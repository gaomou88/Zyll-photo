org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 包名：开源版用独立的包名，可以和 Play 版同时安装
zyll.appId=com.zyll.photo.oss

# 网盘 OAuth 客户端 ID（公开标识，不是密钥）。自己构建时填自己登记的客户端，
# 也可以写在 ~/.gradle/gradle.properties 或用环境变量 ZYLL_GOOGLE_CLIENT_ID / ZYLL_ONEDRIVE_CLIENT_ID。
# 留空时设置页显示“未配置”。登记方法见 README。
zyll.googleClientId=
zyll.onedriveClientId=
# OneDrive Android 平台登记的签名哈希（URL 编码后），也可用环境变量 ZYLL_ONEDRIVE_SIGNATURE_HASH
zyll.onedriveSignatureHash=

name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android
        run: ./gradlew :core:crypto:test :core:search:test :core:backup:test

      # Optional release signing: set ZYLL_KEYSTORE_BASE64, ZYLL_STORE_PASSWORD, ZYLL_KEY_ALIAS, ZYLL_KEY_PASSWORD
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZYLL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ZYLL_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: android
        env:
          ZYLL_GOOGLE_CLIENT_ID: ${{ secrets.ZYLL_GOOGLE_CLIENT_ID }}
          ZYLL_ONEDRIVE_CLIENT_ID: ${{ secrets.ZYLL_ONEDRIVE_CLIENT_ID }}
          ZYLL_ONEDRIVE_SIGNATURE_HASH: ${{ secrets.ZYLL_ONEDRIVE_SIGNATURE_HASH }}
          ZYLL_STORE_PASSWORD: ${{ secrets.ZYLL_STORE_PASSWORD }}
          ZYLL_KEY_ALIAS: ${{ secrets.ZYLL_KEY_ALIAS }}
          ZYLL_KEY_PASSWORD: ${{ secrets.ZYLL_KEY_PASSWORD }}
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubRelease

      # No closed-source Google libraries may end up in the app
      - name: Dependency check
        working-directory: android
        run: |
          ./gradlew -q :app:dependencies --configuration githubReleaseRuntimeClasspath > deps.txt
          if grep -E "com\.android\.billingclient|com\.google\.android\.gms|com\.google\.android\.play|com\.google\.firebase|com\.microsoft\.onnx" deps.txt; then
            echo "::error::closed-source or AI dependency found"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: zyll-photo-apks
          path: android/app/build/outputs/apk/*/*/*.apk
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android/app/build/outputs/apk/github/release/*.apk | head -1)
          cp "$APK" "zyll-photo-${GITHUB_REF_NAME}.apk"
          sha256sum "zyll-photo-${GITHUB_REF_NAME}.apk" > "zyll-photo-${GITHUB_REF_NAME}.apk.sha256"
          gh release create "$GITHUB_REF_NAME" "zyll-photo-${GITHUB_REF_NAME}.apk" "zyll-photo-${GITHUB_REF_NAME}.apk.sha256" --generate-notes
